name: Release Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi

          # Keep only base64 characters. This removes spaces/newlines and stray
          # characters that copy-paste picks up — e.g. the "%" zsh prints after
          # output with no trailing newline (base64 -w0 has none).
          CLEANED="$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -dc 'A-Za-z0-9+/=')"
          echo "Base64 length after cleanup: ${#CLEANED}"

          if ! printf '%s' "$CLEANED" | base64 -d > "$RUNNER_TEMP/abbabal-release.keystore" 2>/dev/null; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64. Re-set the secret with: base64 -w0 apps/mobile/android/abbabal-release.keystore"
            exit 1
          fi

          size=$(stat -c%s "$RUNNER_TEMP/abbabal-release.keystore")
          magic=$(od -An -tx1 -N4 "$RUNNER_TEMP/abbabal-release.keystore" | tr -d ' ')
          echo "Decoded keystore: $size bytes, magic $magic"

          # PKCS#12 starts with 3082, JKS with feedfeed.
          case "$magic" in
            3082*|feedfeed*) echo "Keystore format looks valid." ;;
            *)
              echo "::error::Decoded file is not a valid keystore (magic $magic). The secret is likely truncated or wrong."
              exit 1
              ;;
          esac

      - name: Build web assets
        run: pnpm --filter @abbabal/mobile build

      - name: Sync Capacitor project
        run: pnpm --filter @abbabal/mobile android:sync

      - name: Build signed APK
        working-directory: apps/mobile/android
        env:
          ABBABAL_KEYSTORE_FILE: ${{ runner.temp }}/abbabal-release.keystore
          ABBABAL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ABBABAL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ABBABAL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Collect APK
        run: |
          mkdir -p dist
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk dist/abbabal.apk
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: abbabal-apk
          path: dist/abbabal.apk

      # Runs only for `v*` tags, not manual dispatches.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/abbabal.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
