<!doctype html>
<html lang="%sveltekit.lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
			rel="stylesheet"
		/>
		<script>
			// Apply the stored theme before first paint so there's no flash of the wrong theme.
			try {
				var stored = localStorage.getItem('theme');
				var isDark = stored
					? stored === 'dark'
					: matchMedia('(prefers-color-scheme: dark)').matches;
				if (isDark) document.documentElement.classList.add('dark');
			} catch (e) {
				/* storage unavailable */
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
